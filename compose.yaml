services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: domu_api_java21

    ports:
      - "8080:8080"
      - "127.0.0.1:5005:5005"

    environment:
      JAVA_TOOL_OPTIONS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

      URL_BBDD: ${URL_BBDD:-}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      URL_BBDD2: jdbc:mysql://host.docker.internal:3306/api_domu?useSSL=false&serverTimezone=UTC
      USR_BBDD: root
      PSW_BBDD: ${PSW_BBDD:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"
